<header class="nav">
  <div class="nav__inner">
    <a class="nav__brand" routerLink="/">DatingApp</a>

    @if (auth.isLoggedIn()) {
      <nav class="nav__links" aria-label="Main">
        <a routerLink="/members" routerLinkActive="is-active">Matches</a>
        <a routerLink="/lists" routerLinkActive="is-active">Likes</a>
        <a routerLink="/messages" routerLinkActive="is-active">Messages</a>
        <a routerLink="/blocked" routerLinkActive="is-active">Blocked</a>
      </nav>

      <div class="nav__account">
        <button
          type="button"
          class="nav__me"
          aria-haspopup="true"
          [attr.aria-expanded]="menuOpen()"
          aria-controls="account-menu"
          (click)="menuOpen.set(!menuOpen())"
        >
          <app-avatar [url]="auth.photoUrl()" [name]="auth.displayName()" size="sm" [decorative]="true" />
          <span>{{ auth.displayName() }}</span>
        </button>
        @if (menuOpen()) {
          <ul id="account-menu" class="nav__menu card">
            <li>
              <a routerLink="/member/edit" (click)="menuOpen.set(false)">Edit profile</a>
            </li>
            <li><button type="button" (click)="logout()">Log out</button></li>
          </ul>
        }
      </div>
    } @else {
      <form class="nav__login" #loginForm="ngForm" (ngSubmit)="login()">
        <label class="visually-hidden" for="nav-username">Username</label>
        <input
          id="nav-username"
          class="input"
          name="username"
          placeholder="Username"
          autocomplete="username"
          required
          [(ngModel)]="credentials.username"
        />
        <label class="visually-hidden" for="nav-password">Password</label>
        <input
          id="nav-password"
          class="input"
          type="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
          [(ngModel)]="credentials.password"
        />
        <button class="btn btn--sage" type="submit" [disabled]="!loginForm.valid || signingIn()">
          {{ signingIn() ? 'Logging in…' : 'Log in' }}
        </button>
      </form>
    }
  </div>
</header>
