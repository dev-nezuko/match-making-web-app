<article class="member card">
  <a class="member__photo" [routerLink]="['/members', user().id]" [attr.aria-label]="'View ' + user().knownAs + '’s profile'">
    <app-avatar [url]="user().photoUrl" [name]="user().knownAs" size="fill" [decorative]="true" />
  </a>
  <div class="member__body">
    <h3 class="member__name">
      <a [routerLink]="['/members', user().id]">{{ user().knownAs }}</a>, {{ user().age }}
    </h3>
    <p class="member__place">{{ user().city }}</p>
    <div class="member__actions">
      <button type="button" class="btn btn--small" (click)="like()" [attr.aria-label]="'Like ' + user().knownAs">
        Like
      </button>
      <button
        type="button"
        class="btn btn--small btn--ghost"
        (click)="dislike()"
        [attr.aria-label]="'Pass on ' + user().knownAs"
      >
        Pass
      </button>
      <a
        class="btn btn--small btn--ghost member__message"
        [routerLink]="['/members', user().id]"
        [queryParams]="{ tab: 'messages' }"
        [attr.aria-label]="'Message ' + user().knownAs"
        >Message</a
      >
    </div>
  </div>
</article>
